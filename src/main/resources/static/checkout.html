<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | F2C Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-flower1 text-success fs-3"></i> F2C Marketplace
            </a>
            <div id="nav-auth-container" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <!-- Checkout Screen -->
    <div class="container py-5">
        <h3 class="fw-bold mb-4"><i class="bi bi-shield-lock-fill text-success me-2"></i>Secure Checkout</h3>
        
        <div class="row">
            
            <!-- Delivery & Payment Form -->
            <div class="col-lg-7 mb-4">
                <div class="card p-4 shadow-sm border-color">
                    <form id="checkout-form">
                        
                        <!-- Shipping Info -->
                        <h5 class="fw-bold mb-3 text-success"><i class="bi bi-truck me-2"></i>1. Delivery Address</h5>
                        <div class="mb-4">
                            <label class="form-label">Full Shipping Address</label>
                            <textarea id="shipping-address" class="form-control" rows="3" placeholder="Enter flat, house number, area, city, and state details..." required></textarea>
                        </div>
                        
                        <!-- Payment Gateways -->
                        <h5 class="fw-bold mb-3 text-success border-top pt-4 border-color"><i class="bi bi-credit-card-2-front me-2"></i>2. Choose Payment Method</h5>
                        <div class="mb-4">
                            <!-- UPI Option -->
                            <div class="form-check card p-3 mb-2 flex-row align-items-center gap-3 border-color" style="cursor: pointer;">
                                <input class="form-check-input ms-0 mt-0" type="radio" name="paymentMethod" id="pay-upi" value="UPI" checked>
                                <label class="form-check-label w-100" for="pay-upi">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fw-bold text-dark"><i class="bi bi-phone-vibrate text-primary me-2"></i>UPI (Google Pay, PhonePe, Paytm)</span>
                                        <span class="badge bg-primary-subtle text-primary">Popular</span>
                                    </div>
                                </label>
                            </div>
                            
                            <!-- Card Option -->
                            <div class="form-check card p-3 mb-2 flex-row align-items-center gap-3 border-color" style="cursor: pointer;">
                                <input class="form-check-input ms-0 mt-0" type="radio" name="paymentMethod" id="pay-card" value="CARD">
                                <label class="form-check-label w-100" for="pay-card">
                                    <span class="fw-bold text-dark"><i class="bi bi-credit-card text-success me-2"></i>Credit / Debit Cards (Visa, Mastercard, RuPay)</span>
                                </label>
                            </div>
                            
                            <!-- Netbanking -->
                            <div class="form-check card p-3 mb-2 flex-row align-items-center gap-3 border-color" style="cursor: pointer;">
                                <input class="form-check-input ms-0 mt-0" type="radio" name="paymentMethod" id="pay-net" value="NET_BANKING">
                                <label class="form-check-label w-100" for="pay-net">
                                    <span class="fw-bold text-dark"><i class="bi bi-bank text-info me-2"></i>Net Banking</span>
                                </label>
                            </div>

                            <!-- Cash on Delivery -->
                            <div class="form-check card p-3 mb-2 flex-row align-items-center gap-3 border-color" style="cursor: pointer;">
                                <input class="form-check-input ms-0 mt-0" type="radio" name="paymentMethod" id="pay-cod" value="COD">
                                <label class="form-check-label w-100" for="pay-cod">
                                    <span class="fw-bold text-dark"><i class="bi bi-cash-stack text-warning me-2"></i>Cash on Delivery (COD)</span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" id="place-order-btn" class="btn btn-success w-100 py-3 rounded-pill fw-bold mt-3">
                            Place Order
                        </button>
                    </form>
                    
                    <div class="alert alert-success mt-3 d-none" id="checkout-alert"></div>
                </div>
            </div>

            <!-- Order Items Summary Box -->
            <div class="col-lg-5">
                <div class="card p-4 shadow-sm border-color bg-light">
                    <h5 class="fw-bold mb-4">Review Your Items</h5>
                    <div id="checkout-summary">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container text-center text-white-50 small">
            <p class="mb-0">&copy; 2026 F2C – Farmer to Customer Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
