<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | F2C Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-flower1 text-success fs-3"></i> F2C Marketplace
            </a>
            <div id="nav-auth-container" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <!-- Cart Layout -->
    <div class="container py-5">
        <h3 class="fw-bold mb-4"><i class="bi bi-cart3 text-success me-2"></i>Your Shopping Cart</h3>
        
        <div class="row">
            
            <!-- Items Table -->
            <div class="col-lg-8 mb-4">
                <div class="card p-3 shadow-sm border-color">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead>
                                <tr class="text-muted small border-bottom border-color">
                                    <th scope="col" class="border-0">Product Details</th>
                                    <th scope="col" class="border-0">Price</th>
                                    <th scope="col" class="border-0">Quantity</th>
                                    <th scope="col" class="border-0">Total</th>
                                    <th scope="col" class="border-0"></th>
                                </tr>
                            </thead>
                            <tbody id="cart-items-container">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Price Breakdown Summary -->
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-color">
                    <h5 class="fw-bold mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal:</span>
                        <span id="cart-subtotal" class="fw-semibold">₹0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Delivery Charges:</span>
                        <span class="text-success fw-semibold">FREE</span>
                    </div>
                    <hr class="border-color">
                    <div class="d-flex justify-content-between mb-4 fw-bold text-success fs-5">
                        <span>Total:</span>
                        <span id="cart-total">₹0.00</span>
                    </div>
                    
                    <a href="checkout.html" id="checkout-btn-link" class="btn btn-success w-100 py-3 rounded-pill fw-bold disabled">
                        Proceed to Checkout
                    </a>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container text-center text-white-50 small">
            <p class="mb-0">&copy; 2026 F2C – Farmer to Customer Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
