<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | F2C Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-flower1 text-success fs-3"></i> F2C Marketplace
            </a>
            <div id="nav-auth-container" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <!-- Main Dashboard Grid -->
    <div class="container py-4">
        <div class="dashboard-grid">
            
            <!-- Sidebar Panel -->
            <div class="sidebar-panel rounded shadow-sm">
                <h5 class="fw-bold mb-4 text-success"><i class="bi bi-person-fill me-2"></i>My Portal</h5>
                <ul class="sidebar-menu">
                    <li><a href="#" class="active" onclick="switchTab('orders-tab', this)"><i class="bi bi-bag-check"></i>Order History</a></li>
                    <li><a href="#" onclick="switchTab('wishlist-tab', this)"><i class="bi bi-heart"></i>My Wishlist</a></li>
                    <li><a href="#" onclick="switchTab('notif-tab', this)"><i class="bi bi-bell"></i>Notifications</a></li>
                    <li><a href="#" onclick="switchTab('complaints-tab', this)"><i class="bi bi-exclamation-triangle"></i>File Complaint</a></li>
                </ul>
            </div>

            <!-- Content Area -->
            <div class="content-panel">
                
                <!-- 1. Order History Tab -->
                <div class="dashboard-tab" id="orders-tab">
                    <h4 class="fw-bold mb-4">Your Orders</h4>
                    <div id="customer-orders-list" class="row">
                        <!-- Loaded dynamically -->
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Notifications Tab -->
                <div class="dashboard-tab d-none" id="notif-tab">
                    <h4 class="fw-bold mb-4">Notifications</h4>
                    <div id="customer-notif-list" class="list-group">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <!-- 3. Complaints Tab -->
                <div class="dashboard-tab d-none" id="complaints-tab">
                    <h4 class="fw-bold mb-4">Lodge a Complaint</h4>
                    <div class="card p-4 shadow-sm border-color">
                        <form id="complaint-form">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Subject / Reason</label>
                                <input type="text" id="complaint-subject" class="form-control" placeholder="e.g. Delayed Delivery, Damaged tomatoes" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Detailed Message</label>
                                <textarea id="complaint-message" class="form-control" rows="4" placeholder="Tell us exactly what went wrong. Include order ID if applicable..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success rounded-pill px-4">Submit Complaint</button>
                        </form>
                        <div class="alert alert-success mt-3 d-none" id="complaint-alert"></div>
                    </div>
                </div>

                <!-- 4. Wishlist Tab -->
                <div class="dashboard-tab d-none" id="wishlist-tab">
                    <h4 class="fw-bold mb-4">Your Wishlist</h4>
                    <div id="customer-wishlist-list" class="row">
                        <!-- Loaded dynamically -->
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container text-center text-white-50 small">
            <p class="mb-0">&copy; 2026 F2C – Farmer to Customer Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/chatbot.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Verify access
            const user = getCurrentUser();
            if (!user || user.role !== "CUSTOMER") {
                window.location.href = "../login.html";
                return;
            }

            loadCustomerOrders();
            loadCustomerNotifications();
            loadCustomerWishlist();
            
            document.getElementById("complaint-form").addEventListener("submit", submitComplaint);
        });

        function switchTab(tabId, menuLink) {
            // Hide all tabs
            document.querySelectorAll(".dashboard-tab").forEach(tab => tab.classList.add("d-none"));
            // Show active tab
            document.getElementById(tabId).classList.remove("d-none");
            
            // Toggle active menu link
            document.querySelectorAll(".sidebar-menu a").forEach(a => a.classList.remove("active"));
            menuLink.classList.add("active");
        }

        async function loadCustomerOrders() {
            const list = document.getElementById("customer-orders-list");
            try {
                const orders = await apiFetch("/api/orders/customer");
                if (orders.length === 0) {
                    list.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-cart-x fs-1 text-muted"></i>
                            <h5 class="mt-3">No orders found</h5>
                            <p class="text-muted">You haven't placed any orders yet. Visit the <a href="../shop.html">Shop</a>.</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = "";
                orders.forEach(order => {
                    const dateStr = new Date(order.orderDate).toLocaleDateString();
                    let itemsHtml = "";
                    order.items.forEach(item => {
                        itemsHtml += `<span class="badge bg-secondary-subtle text-secondary me-2">${item.product.name} (x${item.quantity})</span>`;
                    });

                    list.innerHTML += `
                        <div class="col-12 mb-3">
                            <div class="card p-3 border-color">
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 border-bottom pb-2 border-color">
                                    <div>
                                        <h6 class="fw-bold mb-0">Order #${order.id}</h6>
                                        <small class="text-muted">Placed on ${dateStr}</small>
                                    </div>
                                    <div>
                                        <span class="badge bg-success-subtle text-success fs-7 me-2">${order.status}</span>
                                        <span class="badge bg-primary text-white fs-7">₹${order.totalAmount}</span>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                    <div>
                                        ${itemsHtml}
                                    </div>
                                    <div>
                                        <a href="../tracking.html?orderId=${order.id}" class="btn btn-outline-success btn-sm rounded-pill px-3">
                                            <i class="bi bi-geo-alt-fill me-1"></i>Track Order
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (e) {
                list.innerHTML = `<div class="alert alert-danger">Failed to load orders: ${e.message}</div>`;
            }
        }

        async function loadCustomerNotifications() {
            const list = document.getElementById("customer-notif-list");
            try {
                const notifs = await apiFetch("/api/notifications");
                if (notifs.length === 0) {
                    list.innerHTML = `<div class="text-muted text-center py-4">No notifications yet.</div>`;
                    return;
                }
                list.innerHTML = "";
                notifs.forEach(n => {
                    const badge = n.isRead ? '' : '<span class="badge bg-danger rounded-pill">NEW</span>';
                    const markBtn = n.isRead ? '' : `
                        <button onclick="markRead(${n.id})" class="btn btn-link text-success p-0 small text-decoration-none">
                            Mark as read
                        </button>
                    `;
                    list.innerHTML += `
                        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-start border-color bg-transparent">
                            <div class="ms-2 me-auto">
                                <div class="fw-bold">${n.message} ${badge}</div>
                                <small class="text-muted">${new Date(n.createdAt).toLocaleString()}</small>
                            </div>
                            ${markBtn}
                        </div>
                    `;
                });
            } catch (e) {
                list.innerHTML = `<div class="text-danger small">Failed to load notifications.</div>`;
            }
        }

        async function markRead(id) {
            try {
                await apiFetch(`/api/notifications/mark-read/${id}`, { method: "PUT" });
                loadCustomerNotifications();
            } catch (e) {
                console.error(e);
            }
        }

        async function submitComplaint(e) {
            e.preventDefault();
            const subject = document.getElementById("complaint-subject").value;
            const message = document.getElementById("complaint-message").value;
            const alertBox = document.getElementById("complaint-alert");

            try {
                await apiFetch(`/api/complaints/add?subject=${encodeURIComponent(subject)}&message=${encodeURIComponent(message)}`, {
                    method: "POST"
                });
                alertBox.className = "alert alert-success mt-3";
                alertBox.textContent = "Complaint registered successfully. Admin will review this shortly.";
                alertBox.classList.remove("d-none");
                document.getElementById("complaint-form").reset();
                setTimeout(() => alertBox.classList.add("d-none"), 3000);
            } catch (err) {
                alertBox.className = "alert alert-danger mt-3";
                alertBox.textContent = err.message || "Failed to log complaint.";
                alertBox.classList.remove("d-none");
            }
        }

        async function loadCustomerWishlist() {
            const list = document.getElementById("customer-wishlist-list");
            try {
                const items = await apiFetch("/api/wishlist");
                if (items.length === 0) {
                    list.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-heartbreak fs-1 text-muted"></i>
                            <h5 class="mt-3">Your Wishlist is empty</h5>
                            <p class="text-muted">Explore fresh products and add them to your wishlist. Visit the <a href="../shop.html">Shop</a>.</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = "";
                items.forEach(item => {
                    const p = item.product;
                    list.innerHTML += `
                        <div class="col-md-6 col-lg-4 mb-3" id="wishlist-item-${p.id}">
                            <div class="card h-100 border-color shadow-sm">
                                <img src="${p.imageUrl || 'https://images.unsplash.com/photo-1597362925123-77861d3fbac7?w=500'}" class="card-img-top object-fit-cover" style="height: 160px;" alt="${p.name}">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h6 class="card-title fw-bold mb-1">${p.name}</h6>
                                        <p class="text-success fw-bold mb-2">₹${p.price} / ${p.unit}</p>
                                        <p class="text-muted small mb-0">${p.description ? p.description.substring(0, 80) + '...' : 'No description'}</p>
                                    </div>
                                    <div class="d-grid gap-2 mt-3">
                                        <button onclick="addWishlistToCart(${p.id}, '${p.name}')" class="btn btn-success btn-sm rounded-pill">
                                            <i class="bi bi-cart-plus me-1"></i> Add to Cart
                                        </button>
                                        <button onclick="removeFromWishlist(${p.id})" class="btn btn-outline-danger btn-sm rounded-pill">
                                            <i class="bi bi-trash me-1"></i> Remove
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                list.innerHTML = `<div class="text-danger small">Failed to load wishlist: ${e.message}</div>`;
            }
        }

        async function addWishlistToCart(productId, productName) {
            try {
                await apiFetch(`/api/cart/add?productId=${productId}&quantity=1`, {
                    method: "POST"
                });
                alert(`"${productName}" added to cart!`);
            } catch (e) {
                alert(e.message || "Failed to add to cart.");
            }
        }

        async function removeFromWishlist(productId) {
            if (!confirm("Are you sure you want to remove this item from your wishlist?")) return;
            try {
                await apiFetch(`/api/wishlist/remove/${productId}`, {
                    method: "DELETE"
                });
                // Remove card from UI
                const card = document.getElementById(`wishlist-item-${productId}`);
                if (card) card.remove();
                
                // Recalculate if empty
                const list = document.getElementById("customer-wishlist-list");
                if (list.children.length === 0) {
                    list.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-heartbreak fs-1 text-muted"></i>
                            <h5 class="mt-3">Your Wishlist is empty</h5>
                            <p class="text-muted">Explore fresh products and add them to your wishlist. Visit the <a href="../shop.html">Shop</a>.</p>
                        </div>
                    `;
                }
            } catch (e) {
                alert(e.message || "Failed to remove item.");
            }
        }
    </script>
</body>
</html>
