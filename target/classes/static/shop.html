<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flipkart style catalog containing fresh organic crops, vegetables, and milk direct from Indian farmers. Apply filters to customize your preferences.">
    <title>Shop Farm Produce | F2C – Farmer to Customer Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-flower1 text-success fs-3"></i> F2C Marketplace
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="shop.html">Shop Produce</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html?category=1">Vegetables</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html?category=2">Fruits</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-link theme-toggle p-2 text-decoration-none" id="theme-toggle-btn">
                        <i class="bi bi-moon-fill text-secondary"></i>
                    </button>
                    <div id="nav-auth-container" class="d-flex align-items-center">
                        <a href="login.html" class="btn btn-outline-success rounded-pill px-4">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">
        <div class="row">
            
            <!-- Left Filter Panel (Flipkart Style) -->
            <div class="col-lg-3 mb-4">
                <div class="card p-3 shadow-sm border-color">
                    <h5 class="fw-bold mb-3"><i class="bi bi-filter-circle text-success me-2"></i>Filters</h5>
                    
                    <!-- Search Bar -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Search Keywords</label>
                        <form id="shop-search-form" class="input-group">
                            <input type="text" id="shop-search-input" class="form-control" placeholder="Search tomato, milk..." style="padding: 8px 12px;">
                            <button type="submit" class="btn btn-success"><i class="bi bi-search"></i></button>
                        </form>
                    </div>

                    <!-- Category List Group -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Categories</label>
                        <div class="list-group" id="filter-category-list">
                            <!-- Loaded via JS -->
                        </div>
                    </div>

                    <!-- Price Slider -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold d-flex justify-content-between">
                            <span>Max Price</span>
                            <span id="price-range-val" class="text-success fw-bold">₹1000</span>
                        </label>
                        <input type="range" class="form-range text-success" id="price-range-slider" min="10" max="1000" step="10" value="1000">
                    </div>

                    <!-- Rating selection -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Customer Ratings</label>
                        <select class="form-select" id="rating-filter-select">
                            <option value="0">All Ratings</option>
                            <option value="4">4.0 ★ &amp; above</option>
                            <option value="3">3.0 ★ &amp; above</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Right Product Listings Grid -->
            <div class="col-lg-9">
                <!-- Sorting & Top Bar -->
                <div class="card p-3 mb-4 shadow-sm d-flex flex-row justify-content-between align-items-center flex-wrap gap-2 border-color">
                    <h5 class="mb-0 fw-bold">Fresh Farm Products</h5>
                    <div class="d-flex align-items-center gap-2">
                        <label class="small text-muted text-nowrap">Sort By:</label>
                        <select class="form-select form-select-sm" id="shop-sort-select" style="width: 160px; padding: 6px 12px;">
                            <option value="default">Relevance</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="newest">Freshly Harvested</option>
                        </select>
                    </div>
                </div>

                <!-- Grid Products -->
                <div class="row" id="product-grid">
                    <!-- Products rendered by shop.js -->
                </div>
            </div>
            
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container">
            <div class="border-top pt-4 text-center text-white-50 small border-secondary">
                <p class="mb-0">&copy; 2026 F2C – Farmer to Customer Marketplace. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
