<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Inventory | F2C Farmer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-flower1 text-success fs-3"></i> F2C Farmer Portal
            </a>
            <div id="nav-auth-container" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <!-- Main Grid -->
    <div class="container py-4">
        <div class="dashboard-grid">
            
            <!-- Sidebar -->
            <div class="sidebar-panel rounded shadow-sm">
                <h5 class="fw-bold mb-4 text-success"><i class="bi bi-patch-check-fill me-2"></i>Farmer Panel</h5>
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html"><i class="bi bi-graph-up-arrow"></i>Sales Analytics</a></li>
                    <li><a href="inventory.html" class="active"><i class="bi bi-journal-bookmark-fill"></i>Manage Products</a></li>
                </ul>
            </div>

            <!-- Content Panel -->
            <div class="content-panel">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">My Crop Inventory</h4>
                    <button class="btn btn-success rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openAddModal()">
                        <i class="bi bi-plus-circle me-1"></i>Add New Product
                    </button>
                </div>

                <!-- Products Table -->
                <div class="card p-4 shadow-sm border-color">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead>
                                <tr class="text-muted small border-bottom border-color">
                                    <th>Image</th>
                                    <th>Product Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock Level</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="farmer-inventory-table">
                                <!-- Loaded dynamically -->
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">No products listed. Add one above!</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Product Add/Edit Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--card-bg); border: 1px solid var(--border-color);">
                <div class="modal-header border-color">
                    <h5 class="modal-title fw-bold" id="productModalLabel">Add Crop Product</h5>
                    <button type="button" class="btn-close" data-bs-style="color: var(--text-color)" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="product-form">
                    <div class="modal-body">
                        <input type="hidden" id="form-product-id">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Product Name</label>
                            <input type="text" id="prod-name" class="form-control" placeholder="e.g. Organic Tomatoes" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea id="prod-desc" class="form-control" rows="2" placeholder="Tell customers how it is grown, sized, or sweet..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Category</label>

                                    <select id="prod-category" class="form-select" required>
                                        <option value="">Loading Categories...</option>
                                    </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Selling Price (₹)</label>
                                <input type="number" id="prod-price" class="form-control" placeholder="e.g. 45" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Available Stock</label>
                                <input type="number" id="prod-qty" class="form-control" placeholder="e.g. 150" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Unit of Measure</label>
                                <select id="prod-unit" class="form-select" required>
                                    <option value="kg">kg (Kilogram)</option>
                                    <option value="litre">litre (Litre)</option>
                                    <option value="dozen">dozen</option>
                                    <option value="bundle">bundle</option>
                                    <option value="crate">crate</option>
                                    <option value="piece">piece</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Product Image URL</label>
                            <input type="text" id="prod-img" class="form-control" placeholder="Paste Unspsh or data URL link..." required>
                            <!-- Quick Image Placeholder Helpers -->
                            <div class="mt-2 d-flex gap-2">
                                <button type="button" class="btn btn-outline-secondary btn-xs py-1 px-2" style="font-size:10px" onclick="setPlaceholderImg('tomatoes')">Tomato</button>
                                <button type="button" class="btn btn-outline-secondary btn-xs py-1 px-2" style="font-size:10px" onclick="setPlaceholderImg('potato')">Potato</button>
                                <button type="button" class="btn btn-outline-secondary btn-xs py-1 px-2" style="font-size:10px" onclick="setPlaceholderImg('milk')">Milk</button>
                                <button type="button" class="btn btn-outline-secondary btn-xs py-1 px-2" style="font-size:10px" onclick="setPlaceholderImg('apple')">Apple</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-color">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container text-center text-white-50 small">
            <p class="mb-0">&copy; 2026 F2C – Farmer to Customer Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/chatbot.js"></script>

    <script>
        let modalElement = null;
        let bsModal = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const user = getCurrentUser();
            if (!user || user.role !== "FARMER") {
                window.location.href = "../login.html";
                return;
            }

            modalElement = document.getElementById("productModal");
            bsModal = new bootstrap.Modal(modalElement);

            await loadCategoriesDropdown();
            await loadFarmerInventory();

            document.getElementById("product-form").addEventListener("submit", handleFormSubmit);
        });

        async function loadCategoriesDropdown() {
    try {
        const categories = await apiFetch("/api/categories/public/list");

        console.log("Categories:", categories);

        const select = document.getElementById("prod-category");

        if (!select) {
            alert("prod-category dropdown not found!");
            return;
        }

        select.innerHTML = "";

        categories.forEach(cat => {
            select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
        });

    } catch (e) {
        console.error(e);
        alert("Error: " + e.message);
    }
}

        async function loadFarmerInventory() {
            const tableBody = document.getElementById("farmer-inventory-table");
            try {
                const products = await apiFetch("/api/farmer/products");
                if (products.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No products listed. Add one above!</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                products.forEach(p => {
                    tableBody.innerHTML += `
                        <tr>
                            <td class="align-middle">
                                <img src="${p.imageUrl || 'https://images.unsplash.com/photo-1597362925123-77861d3fbac7?w=50'}" 
                                width="40" height="40" class="rounded object-fit-cover shadow-sm">
                            </td>
                            <td class="align-middle fw-semibold">${p.name}</td>
                            <td class="align-middle">${p.category.name}</td>
                            <td class="align-middle fw-bold text-success">₹${p.price} / ${p.unit}</td>
                            <td class="align-middle">
                                <span class="badge ${p.quantity > 10 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                                    ${p.quantity} ${p.unit} Left
                                </span>
                            </td>
                            <td class="align-middle"><span class="badge bg-success-subtle text-success">${p.status}</span></td>
                            <td class="align-middle">
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-primary btn-sm px-2 py-1" onclick="openEditModal(${p.id})">Edit</button>
                                    <button class="btn btn-outline-danger btn-sm px-2 py-1" onclick="deleteProduct(${p.id})">Delete</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Failed to load inventory: ${e.message}</td></tr>`;
            }
        }

        function openAddModal() {
            document.getElementById("productModalLabel").textContent = "Add Crop Product";
            document.getElementById("form-product-id").value = "";
            document.getElementById("product-form").reset();
        }

        async function openEditModal(productId) {
            document.getElementById("productModalLabel").textContent = "Edit Crop Product";
            try {
                const p = await apiFetch(`/api/products/details/${productId}`);
                document.getElementById("form-product-id").value = p.id;
                document.getElementById("prod-name").value = p.name;
                document.getElementById("prod-desc").value = p.description || "";
                document.getElementById("prod-category").value = p.category.id;
                document.getElementById("prod-price").value = p.price;
                document.getElementById("prod-qty").value = p.quantity;
                document.getElementById("prod-unit").value = p.unit;
                document.getElementById("prod-img").value = p.imageUrl || "";

                bsModal.show();
            } catch (e) {
                alert(e.message || "Failed to fetch details.");
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const productId = document.getElementById("form-product-id").value;
            const categoryId = document.getElementById("prod-category").value;
            
            const payload = {
                name: document.getElementById("prod-name").value,
                description: document.getElementById("prod-desc").value,
                price: parseFloat(document.getElementById("prod-price").value),
                quantity: parseFloat(document.getElementById("prod-qty").value),
                unit: document.getElementById("prod-unit").value,
                imageUrl: document.getElementById("prod-img").value
            };

            try {
                if (productId) {
                    // Update
                    await apiFetch(`/api/farmer/products/update/${productId}`, {
                        method: "PUT",
                        body: JSON.stringify(payload)
                    });
                    alert("Product updated successfully!");
                } else {
                    // Add
                    await apiFetch(`/api/farmer/products/add?categoryId=${categoryId}`, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    alert("Product added successfully!");
                }

                bsModal.hide();
                loadFarmerInventory();
            } catch (err) {
                alert(err.message || "Failed to save product.");
            }
        }

        async function deleteProduct(productId) {
            if (!confirm("Are you sure you want to delete this product?")) return;
            try {
                await apiFetch(`/api/farmer/products/delete/${productId}`, {
                    method: "DELETE"
                });
                alert("Product deleted.");
                loadFarmerInventory();
            } catch (e) {
                alert(e.message || "Failed to delete product.");
            }
        }

        function setPlaceholderImg(type) {
            const urls = {
                tomatoes: "https://images.unsplash.com/photo-1595855759920-86582396756a?w=500",
                potato: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500",
                milk: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500",
                apple: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=500"
            };
            document.getElementById("prod-img").value = urls[type];
        }
    </script>
</body>
</html>
