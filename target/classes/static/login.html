<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | F2C Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--bg-color);">

    <div class="card p-4 shadow-lg border-color" style="max-width: 400px; width: 100%; border-radius: 20px; background-color: var(--card-bg);">
        <div class="text-center mb-4">
            <a href="index.html" class="fs-3 fw-bold text-success text-decoration-none">
                <i class="bi bi-flower1"></i> F2C Marketplace
            </a>
            <h5 class="mt-3 mb-1 fw-bold">Welcome Back!</h5>
            <p class="text-muted small">Access your customized portal</p>
        </div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="login-email" placeholder="name@domain.com" required style="padding: 10px 14px;">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="login-password" placeholder="••••••••" required style="padding: 10px 14px;">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2.5 mt-2" style="font-weight: 600; border-radius: 8px;">Sign In</button>
        </form>

        <div class="alert alert-danger mt-3 d-none" id="auth-alert" style="font-size: 13px;"></div>

        <div class="text-center mt-4 border-top pt-3 border-color">
            <p class="mb-0 small text-muted">Don't have an account? <a href="register.html" class="text-success fw-bold">Sign Up</a></p>
            <p class="mt-2 small"><a href="index.html" class="text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
